name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and sync web game assets into Android assets
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run android:sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: android

      - name: Verify and prepare Android Gradle Wrapper
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradlew" ]; then
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew -o gradlew
          fi
          if [ ! -f "gradlew.bat" ]; then
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat -o gradlew.bat
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -la gradlew gradlew.bat gradle/wrapper/

      - name: Build Debug and Release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrasOfBharata-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstrasOfBharata-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
