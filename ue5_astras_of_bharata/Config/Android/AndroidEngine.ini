[/Script/Engine.RendererSettings]
; ============================================================================
; ANDROID MOBILE PIPELINE: MOBILE FORWARD RENDERER + BAKED LIGHTING + CSM + IMPOSTERS
; ============================================================================
; Strictly disable desktop Nanite, Lumen, and VSM on Android runtime
r.Nanite=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0

; Mobile Forward Shading Path + Baked Lightmaps + Cascaded Shadow Maps
r.AllowStaticLighting=True
r.Mobile.ShadingPath=0
r.MobileHDR=True
r.Mobile.AllowDitheredLODTransition=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableDirectionalLights=True
r.Mobile.Forward.EnableLocalLights=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.AntiAliasing=2
r.DefaultFeature.AntiAliasing=2
r.Mobile.FloatPrecisionMode=1

; Cascaded Shadow Map + Single-Layer Water Mobile Shaders
r.ShadowQuality=2
r.Shadow.CSM.MaxMobileCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.85
r.Water.SingleLayer=1
r.Water.SingleLayer.Shaders=1

; Imposter & LOD Distance Budget Enforcement
r.StaticMeshLODDistanceScale=1.35
r.SkeletalMeshLODBias=1
foliage.LODDistanceScale=0.75
r.HLOD=1
r.ViewDistanceScale=0.80

; Painterly Atmospheric Tone & Smoothed Sharpen (38%)
r.BloomQuality=2
r.AmbientOcclusionLevels=1
r.VolumetricFog=0
r.SkyAtmosphere=1
r.Tonemapper.Sharpen=0.38
r.MobileContentScaleFactor=1.0
r.DiscardUnusedQuality=True

[SystemSettings]
r.Mobile.ForceDepthPrepass=1
r.FinishCurrentFrame=0
r.Streaming.PoolSize=420
r.Streaming.LimitPoolSizeToVRAM=1
fx.Niagara.Scalability.TotalConcurrentEffectsScale=0.75
